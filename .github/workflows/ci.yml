name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run. CI minutes spent verifying
# a commit nobody will merge are wasted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Tests run against real PostgreSQL and real Redis. Cross-tenant isolation,
    # aggregation correctness, and TIMESTAMPTZ behaviour across a DST boundary either
    # do not exist or behave differently in SQLite, so substituting one would mean
    # the tests that matter most are the ones not being run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visitnote
          POSTGRES_PASSWORD: visitnote
          POSTGRES_DB: visitnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U visitnote"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql://visitnote:visitnote@localhost:5432/visitnote
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      CORS_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ffmpeg
        # Installed explicitly rather than relied on from the runner image. The
        # pipeline tests skip themselves when ffmpeg is absent, so without this a
        # runner change would quietly drop coverage of the most important code in
        # the backend instead of failing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Migrate
        # Migrations are a distinct step here for the same reason they are in the
        # deploy pipeline: a migration failure must be distinguishable from a test
        # failure, and must never run implicitly at application startup.
        run: alembic upgrade head

      - name: Verify migrations are reversible
        # A rollback path that is never exercised is a rollback path that does not
        # work. Discovering that during an incident is the worst possible time.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify models match migrations
        # Catches model-versus-migration drift: a model constraint name (or type,
        # default, etc.) that disagrees with what the migrations actually created.
        # That drift is silent until someone runs `alembic revision --autogenerate`
        # against it and gets a spurious drop-and-recreate of a live constraint --
        # which is exactly how the visits idempotency constraint went undetected for
        # a full phase before this check existed.
        run: alembic check

      - name: Test
        run: pytest -q

  contract:
    name: contract (openapi -> generated types)
    runs-on: ubuntu-latest

    # The same class of check as `alembic check` in the backend job, one layer up.
    # The client's types are generated from the API's OpenAPI document, and the whole
    # safety claim -- that a backend contract change surfaces as a TypeScript compile
    # error rather than a runtime surprise -- holds only while the committed types
    # actually match the API. A *new* field breaks no existing call site, so drift is
    # silent: `jurisdiction` was added to UserProfile and OnboardingRequest in phase
    # 4b and `fdar` to NoteFormat, and none of it reached the client for a full phase
    # because nothing here was checking.
    #
    # No server and no database: the document is built from the app object directly,
    # which is the same document the API serves.
    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql://visitnote:visitnote@localhost:5432/visitnote
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      CORS_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install web
        # `npm ci` rather than npx-on-demand, so the generator is the version the
        # repository pins. A different generator version would produce a spurious
        # diff and report drift that does not exist.
        working-directory: web
        run: npm ci

      - name: Export the API's OpenAPI document
        working-directory: backend
        run: python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > ../openapi.json

      - name: Regenerate the client types
        working-directory: web
        run: npx openapi-typescript ../openapi.json -o src/api/schema.d.ts

      - name: Verify the committed types match the API
        run: |
          if ! git diff --exit-code -- web/src/api/schema.d.ts; then
            echo "::error::web/src/api/schema.d.ts is stale. Run 'npm run generate:api' in web/ against a running API, and commit the result."
            exit 1
          fi

  web:
    name: web (tsc, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run
